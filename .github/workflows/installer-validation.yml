            try { await access(path); throw new Error("Installer should have cleaned up " + path); }
            catch (error) { if (error?.code !== "ENOENT") throw error; }
          }
          console.log("Installation lock exists and temporary bootstrap/progress files were cleaned up.");
          NODE
      - name: Verify main migration guard refuses blind retry
        env:
          DATABASE_URL: mysql://root:ci-root-password@127.0.0.1:3306/arbitrade_ci
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import mysql from "mysql2/promise";
          import { createHash } from "node:crypto";
          import { readFile } from "node:fs/promises";
          const admin = await mysql.createConnection(process.env.DATABASE_URL);
          await admin.query("CREATE DATABASE arbitrade_main_failed");
          const failed = await mysql.createConnection({
            host: "127.0.0.1", port: 3306, user: "root", password: "ci-root-password",
            database: "arbitrade_main_failed",
          });
          await failed.query("CREATE TABLE __drizzle_migrations (id INT NOT NULL AUTO_INCREMENT PRIMARY KEY, hash VARCHAR(255) NOT NULL, created_at BIGINT NOT NULL)");
          const journal = JSON.parse(await readFile("drizzle/meta/_journal.json", "utf8"));
          const firstMigration = journal.entries[0];
          const firstSql = await readFile("drizzle/" + firstMigration.tag + ".sql", "utf8");
          const firstHash = createHash("sha256").update(firstSql).digest("hex");
          await failed.execute("INSERT INTO __drizzle_migrations (hash,created_at) VALUES (?,?)", [firstHash, firstMigration.when]);
          await failed.query("CREATE TABLE main_migration_run_guard (id TINYINT NOT NULL PRIMARY KEY, status VARCHAR(16) NOT NULL, startedAt TIMESTAMP NULL, finishedAt TIMESTAMP NULL, failureCode VARCHAR(80) NULL, updatedAt TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP) ENGINE=InnoDB");
          await failed.execute("INSERT INTO main_migration_run_guard (id,status) VALUES (1,'failed')");
          await failed.end();
          await admin.end();
          console.log("Disposable failed-main-migration fixture created.");
          NODE
          if DATABASE_URL=mysql://root:ci-root-password@127.0.0.1:3306/arbitrade_main_failed node scripts/guarded-main-migrate.mjs > /tmp/main-migration-guard.log 2>&1; then
            cat /tmp/main-migration-guard.log
            echo "Expected the main migration guard to refuse retry." >&2
            exit 1
          fi
          grep -q "Automatic retry is blocked" /tmp/main-migration-guard.log
          cat /tmp/main-migration-guard.log
          DATABASE_URL=mysql://root:ci-root-password@127.0.0.1:3306/arbitrade_main_failed node --input-type=module <<'NODE'
          import mysql from "mysql2/promise";
          const db = await mysql.createConnection(process.env.DATABASE_URL);
          const [tables] = await db.query("SELECT COUNT(*) AS count FROM information_schema.tables WHERE table_schema=DATABASE()");
          const [guard] = await db.query("SELECT status FROM main_migration_run_guard WHERE id=1");
          const [migrations] = await db.query("SELECT COUNT(*) AS count FROM __drizzle_migrations");
          await db.end();
          if (Number(tables[0].count) !== 2 || guard[0]?.status !== "failed" || Number(migrations[0].count) !== 1) {
            throw new Error("Main migration guard changed the fixture or migration tracker while refusing retry.");
          }
          console.log("PASS: failed main migration remains blocked; schema and tracker are unchanged.");
          NODE

      - name: Verify existing-database migration recovery guards
        env:
          DATABASE_URL: mysql://root:ci-root-password@127.0.0.1:3306/arbitrade_ci
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import mysql from "mysql2/promise";
          import { createHash } from "node:crypto";
          import { readFile } from "node:fs/promises";
          const admin = await mysql.createConnection(process.env.DATABASE_URL);
          await admin.query("CREATE DATABASE arbitrade_existing");
          await admin.query("CREATE DATABASE arbitrade_failed");
          await admin.query("CREATE TABLE arbitrade_existing.kyc_settings (id INT NOT NULL PRIMARY KEY)");
          await admin.end();

          const sql = await readFile("drizzle/0033_kyc_v2.sql", "utf8");
          const checksum = createHash("sha256").update(sql).digest("hex");
          const failed = await mysql.createConnection({
            host: "127.0.0.1", port: 3306, user: "root", password: "ci-root-password",
            database: "arbitrade_failed",
          });
          await failed.query(`
            CREATE TABLE portal_schema_migrations (
              migrationName VARCHAR(160) NOT NULL PRIMARY KEY,
              checksum CHAR(64) NOT NULL,
              status VARCHAR(32) NOT NULL,
              startedAt TIMESTAMP NULL,
              appliedAt TIMESTAMP NULL,
              errorCode VARCHAR(80) NULL,
              detailsJson JSON NULL,
              createdAt TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
              updatedAt TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
              INDEX portal_schema_migrations_status_idx (status, updatedAt)
            ) ENGINE=InnoDB
          `);
          await failed.execute(
            "INSERT INTO portal_schema_migrations (migrationName,checksum,status,errorCode) VALUES (?,?,?,?)",
            ["0033_kyc_v2.sql", checksum, "failed", "CI_SIMULATED_INTERRUPTION"],
          );
          await failed.end();
          console.log("Prepared isolated legacy-schema and interrupted-migration fixtures.");
          NODE

          set +e
          DATABASE_URL=mysql://root:ci-root-password@127.0.0.1:3306/arbitrade_existing node scripts/apply-portal-migrations.mjs >existing-schema.log 2>&1
          existing_status=$?
          set -e
          if [[ "$existing_status" -eq 0 ]] || ! grep -q "Existing portal schema objects were found but no per-file tracker exists" existing-schema.log; then
            cat existing-schema.log
            echo "Existing-schema guard did not reject an untracked existing database." >&2
            exit 1
          fi
          node --input-type=module <<'NODE'
          import mysql from "mysql2/promise";
          const db = await mysql.createConnection({
            host: "127.0.0.1", port: 3306, user: "root", password: "ci-root-password",
            database: "arbitrade_existing",
          });
          const [tracker] = await db.query("SELECT 1 FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name='portal_schema_migrations'");
          const [schema] = await db.query("SELECT 1 FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name='kyc_settings'");
          await db.end();
          if (tracker.length !== 0 || schema.length !== 1) throw new Error("Existing-schema guard changed the database unexpectedly.");
          console.log("PASS: existing untracked schema was preserved and no tracker was fabricated.");
          NODE

          set +e
          DATABASE_URL=mysql://root:ci-root-password@127.0.0.1:3306/arbitrade_failed node scripts/apply-portal-migrations.mjs >failed-migration.log 2>&1
          failed_status=$?
          set -e
          if [[ "$failed_status" -eq 0 ]] || ! grep -q "automatic retry is blocked" failed-migration.log; then
            cat failed-migration.log
            echo "Interrupted migration guard did not block an automatic retry." >&2
            exit 1
          fi
          node --input-type=module <<'NODE'
          import mysql from "mysql2/promise";
          const db = await mysql.createConnection({
            host: "127.0.0.1", port: 3306, user: "root", password: "ci-root-password",
            database: "arbitrade_failed",
          });
          const [rows] = await db.query("SELECT status FROM portal_schema_migrations WHERE migrationName='0033_kyc_v2.sql'");
          const [schema] = await db.query("SELECT 1 FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name='kyc_settings'");
          await db.end();
          if (rows.length !== 1 || rows[0].status !== "failed" || schema.length !== 0) {
            throw new Error("Interrupted migration state changed or migration SQL was executed.");
          }
          console.log("PASS: interrupted migration remained failed and no migration SQL was rerun.");
          NODE

  deployment-packages:
    needs:
      - syntax
      - typecheck
      - application-tests
      - installer-safety
      - production-build
      - installer-fresh-mariadb
      - installer-mysql8-compatibility-and-recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Enable pinned pnpm and build production application
        run: |
          corepack enable
          corepack prepare pnpm@10.18.0 --activate
          pnpm install --frozen-lockfile
          pnpm build
      - name: Assemble and validate one universal deployment ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          package="$RUNNER_TEMP/arbitrade-universal"
          artifacts="$RUNNER_TEMP/deployment-artifacts"
          mkdir -p "$package" "$artifacts"

          # Exclude database snapshots at archive creation time, not after downloading
          # them into the runner. The deployment must never contain production data.
          git archive HEAD -- . ':(exclude)database.sql' ':(exclude)**/database.sql' | tar -x -C "$package"
          cp -a dist "$package/dist"

          cat > "$package/DEPLOYMENT-README.txt" <<'EOF'
          ARBITRADE — UNIVERSAL DEPLOYMENT PACKAGE
          ========================================

          This single ZIP supports two deployment paths. Choose exactly one.

          PATH A — EXISTING DOMAIN + CPANEL
          ---------------------------------
          1. Back up the target database and keep the backup outside the web root.
          2. Upload this ZIP to the domain's application directory. Prefer a private
             application root outside public_html. If the host requires extraction
             under public_html, configure Apache/cPanel access controls so source,
             configuration, logs, lock files, SQL dumps and package metadata cannot
             be downloaded over HTTP. Never leave .env or bootstrap files public.
          3. Extract the ZIP, create a cPanel Node.js application (Node.js 20+;
             Node 22 recommended) with startup file dist/index.js, and install the
             locked dependencies from the private application terminal:
                 corepack enable
                 corepack prepare pnpm@10.18.0 --activate
                 pnpm install --frozen-lockfile
                 pnpm build
          4. Create a dedicated database/user in cPanel. For a genuinely fresh
             installation, select a new EMPTY database. For existing data, first
             import a verified backup and choose existing-database mode instead.
          5. Open https://YOUR-DOMAIN/installer/ and complete the staged browser
             wizard: URL, database connection, initial admin for fresh installs,
             optional OAuth, and email settings. The wizard checks the connection
             and records a protected one-time database inventory; it does not run
             privileged host commands or import large SQL dumps.
          6. Run the exact command displayed by the wizard from the private app root:
             fresh database:
                 node installer/run-install.mjs --fresh-install
             existing database already imported + verified backup:
                 node installer/run-install.mjs --existing-database --confirm-existing-migrations
             Never use fresh-install mode on an existing database.
          7. Restart through cPanel Setup Node.js App. Run:
                 pnpm installer:verify
                 pnpm installer:diagnose
             Verify GET /api/health returns {"status":"ok"}.
          8. Remove/deny public access to /installer/ after setup. Keep .env,
             .installer-bootstrap.json, install markers, logs and SQL backups private.

          Root-only commands that cPanel cannot run (for example, OS packages or
          host-level service changes) must be performed by the VPS administrator
          over SSH. Do not run the fresh-server provisioner on a panel-managed host.

          PATH B — FRESH VPS, NO CPANEL / NO HOSTED DOMAIN
          ------------------------------------------------
          1. Upload the ZIP to a clean supported Debian 12 / Ubuntu 22.04 or 24.04
             VPS using SSH/SCP or the provider console. Do not run on a server with
             existing applications unless you have explicitly reviewed every host
             change and prepared recovery.
          2. Extract into a private directory and enter it:
                 sudo apt-get update
                 sudo apt-get install -y unzip
                 mkdir -p "$HOME/arbitrade-install"
                 unzip arbitrade-universal-installer.zip -d "$HOME/arbitrade-install"
                 cd "$HOME/arbitrade-install"
          3. Inspect the documented options before running any root script:
                 sudo bash installer/vps-preflight.sh
                 sudo bash installer/vps-setup.sh --help
          4. Run the VPS setup in the console with only the options you have reviewed.
             The provisioner may install system packages/runtime, configure a service
             user, systemd and Nginx, and optionally configure TLS. It needs root/sudo.
             Point DNS to the VPS and allow required ports before requesting TLS.
          5. Configure the private environment and database. Then run the same
             staged browser wizard at https://YOUR-DOMAIN/installer/ when the web
             endpoint is available, or use the documented private CLI path. Create
             the initial admin and configure the database through the guided stages.
          6. For a fresh install, verify the database is empty and run:
                 node installer/run-install.mjs --fresh-install
             Never use fresh-install mode against an existing database.
          7. Verify:
                 pnpm installer:verify
                 pnpm installer:diagnose
                 curl --fail https://YOUR-DOMAIN/api/health
             Keep rollback scripts and the verified database backup available.

          SAFETY
          ------
          - Review scripts before executing them with sudo/root.
          - Never expose .env, database dumps, private logs, installer state or source.
          - Existing-database migrations require a current, restorable backup and the
            explicit existing-database confirmation flags.
          - The ZIP contains no database snapshot or deployment secrets.
          - Successful CI tests do not replace a disposable-host rehearsal or operator
            approval. Do not deploy to production until the package is reviewed.
          EOF

          # The single archive carries both the browser wizard and VPS console tools.
          # Exclude machine-local credentials, private keys, SQL exports and nested ZIPs.
          find "$package" -type f \( -name '*.zip' -o -name '*.sql.gz' -o -name '*.dump' -o -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' \) -delete
          find "$package" -type f \( -name '.env' -o -name '.env.local' -o -name '.env.production' -o -name '.env.development.local' \) -delete
          rm -f "$package/database.sql"

          (cd "$package" && zip -X -qr "$artifacts/arbitrade-universal-installer.zip" .)
          unzip -t "$artifacts/arbitrade-universal-installer.zip"
          python3 - "$artifacts/arbitrade-universal-installer.zip" <<'PY'
          import sys, zipfile
          archive = sys.argv[1]
          required = {
              "package.json", "pnpm-lock.yaml", "dist/index.js",
              "dist/public/index.html", "installer/index.php",
              "installer/run-install.mjs", "installer/vps-setup.sh",
              "installer/vps-preflight.sh", "installer/vps-rollback.sh",
              "DEPLOYMENT-README.txt",
          }
          with zipfile.ZipFile(archive) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"Corrupt ZIP entry: {bad}")
              names = set(z.namelist())
              missing = sorted(required - names)
              if missing:
                  raise SystemExit("Missing required package entries: " + ", ".join(missing))
              forbidden = [
                  name for name in names
                  if name == "database.sql"
                  or name.endswith((".sql.gz", ".dump", ".pem", ".key", ".p12", ".pfx", ".zip"))
                  or name in {".env", ".env.local", ".env.production", ".env.development.local"}
              ]
              if forbidden:
                  raise SystemExit("Forbidden secret/database/nested archive entries: " + ", ".join(forbidden))
              if any(name.startswith("../") or name.startswith("/") for name in names):
                  raise SystemExit("Unsafe absolute or parent-relative ZIP path")
          print(f"Validated universal deployment archive: {len(names)} entries, required files present, CRC valid, no database snapshots/secrets/nested ZIPs.")
          PY
      - name: Upload universal deployment package
        uses: actions/upload-artifact@v4
        with:
          name: arbitrade-universal-installer
          path: ${{ runner.temp }}/deployment-artifacts/arbitrade-universal-installer.zip
          if-no-files-found: error
          retention-days: 14


  stage1-progress:
    name: Stage 1 validation dashboard
    if: always()
    needs:
      - syntax
      - typecheck
      - application-tests
      - installer-safety
      - production-build
      - installer-fresh-mariadb
      - installer-mysql8-compatibility-and-recovery
      - deployment-packages
    runs-on: ubuntu-latest
    steps:
      - name: Publish verified run status and remaining acceptance gaps
        env:
          SYNTAX_RESULT: ${{ needs.syntax.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          APPLICATION_TESTS_RESULT: ${{ needs.application-tests.result }}
          INSTALLER_SAFETY_RESULT: ${{ needs.installer-safety.result }}
          PRODUCTION_BUILD_RESULT: ${{ needs.production-build.result }}
          MARIADB_RESULT: ${{ needs.installer-fresh-mariadb.result }}
          MYSQL8_RESULT: ${{ needs.installer-mysql8-compatibility-and-recovery.result }}
          PACKAGE_RESULT: ${{ needs.deployment-packages.result }}
        run: |
          {
            echo "# ARBITRADE Stage 1 — CI progress dashboard"
            echo
            echo "| Validation lane | Result |"
            echo "|---|---|"
            echo "| Syntax and installer CLI safety | ${SYNTAX_RESULT} |"
            echo "| TypeScript | ${TYPECHECK_RESULT} |"
            echo "| Application tests | ${APPLICATION_TESTS_RESULT} |"
            echo "| Installer/migration regression tests | ${INSTALLER_SAFETY_RESULT} |"
            echo "| Production build, bundle budgets, server smoke test | ${PRODUCTION_BUILD_RESULT} |"
            echo "| Disposable MariaDB fresh install | ${MARIADB_RESULT} |"
            echo "| Disposable MySQL 8 compatibility/recovery | ${MYSQL8_RESULT} |"
            echo "| Deployment package validation | ${PACKAGE_RESULT} |"
            echo
            echo "## Acceptance gaps not proven by CI alone"
            echo "- Database-backed wallet/settlement concurrency, rollback, and ledger reconciliation."
            echo "- Cross-account API authorization and notification ownership/replay tests."
            echo "- Browser interaction, accessibility, and measured responsive viewport acceptance."
            echo "- Disposable-host installer failure injection for service activation, Nginx reload, and Certbot paths."
            echo
            echo "This dashboard reports this run's actual job outcomes. It does not automatically increase the Stage 1 completion percentage or authorize production deployment."
          } >> "$GITHUB_STEP_SUMMARY"
