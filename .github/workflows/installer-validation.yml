            if (Number(admins[0].count) !== 1) throw new Error("Expected exactly one CI administrator account.");
             if (!tables.has("trade_lifecycle_events")) throw new Error("Manual settlement lifecycle migration did not create trade_lifecycle_events.");
             const [settlementColumns] = await db.query(
               "SELECT column_name FROM information_schema.columns WHERE table_schema=DATABASE() AND table_name='trade_positions' AND column_name IN ('settlementReference','settlementConfirmedAt','settlementConfirmedBy','settlementNotes')"
             );
             if (settlementColumns.length !== 4) throw new Error("Manual settlement lifecycle migration did not create all settlement columns.");
             const [settlementMigration] = await db.execute(
               "SELECT status FROM portal_schema_migrations WHERE migrationName=?",
               ["0053_manual_settlement_lifecycle.sql"]
             );
             if (settlementMigration.length !== 1 || settlementMigration[0].status !== "applied") {
               throw new Error("Manual settlement lifecycle migration is not recorded as applied.");
             }
            const [drizzle] = await db.query("SELECT COUNT(*) AS count FROM __drizzle_migrations");
            const journal = JSON.parse(await readFile("drizzle/meta/_journal.json", "utf8"));
            if (Number(drizzle[0].count) !== journal.entries.length) throw new Error("Drizzle migration tracker count does not match the complete journal.");
            const [portal] = await db.query("SELECT COUNT(*) AS count FROM portal_schema_migrations");
            const [mining] = await db.query("SELECT COUNT(*) AS count FROM mining_schema_migrations");
            if (Number(drizzle[0].count) < 1 || Number(portal[0].count) < 1 || Number(mining[0].count) < 1) {
              throw new Error("One or more migration trackers contain no records.");
            }
            console.log(JSON.stringify({
              status: "PASS",
              tableCount: tables.size,
              administratorCreated: true,
              migrationRecords: {
                drizzle: Number(drizzle[0].count),
                portal: Number(portal[0].count),
                mining: Number(mining[0].count)
              }
            }, null, 2));
          } finally {
            await db.end();
          }
          for (const path of ["installer/.installed"]) await access(path);
          for (const path of [".installer-bootstrap.json", "installer/.install-in-progress.json"]) {
            try { await access(path); throw new Error("Installer should have cleaned up " + path); }
            catch (error) { if (error?.code !== "ENOENT") throw error; }
          }
          console.log("Installation lock exists and temporary bootstrap/progress files were cleaned up.");
          NODE
      - name: Verify main migration guard refuses blind retry
        env:
          DATABASE_URL: mysql://root:ci-root-password@127.0.0.1:3306/arbitrade_ci
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import mysql from "mysql2/promise";
          const admin = await mysql.createConnection(process.env.DATABASE_URL);
          await admin.query("CREATE DATABASE arbitrade_main_failed");
          const failed = await mysql.createConnection({
            host: "127.0.0.1", port: 3306, user: "root", password: "ci-root-password",
            database: "arbitrade_main_failed",
          });
          await failed.query("CREATE TABLE __drizzle_migrations (id INT NOT NULL AUTO_INCREMENT PRIMARY KEY, hash VARCHAR(255) NOT NULL, created_at BIGINT NOT NULL)");
          await failed.execute("INSERT INTO __drizzle_migrations (hash,created_at) VALUES (?,?)", ["fixture-applied-migration", 1760000000000]);
          await failed.query("CREATE TABLE main_migration_run_guard (id TINYINT NOT NULL PRIMARY KEY, status VARCHAR(16) NOT NULL, startedAt TIMESTAMP NULL, finishedAt TIMESTAMP NULL, failureCode VARCHAR(80) NULL, updatedAt TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP) ENGINE=InnoDB");
          await failed.execute("INSERT INTO main_migration_run_guard (id,status) VALUES (1,'failed')");
          await failed.end();
          await admin.end();
          console.log("Disposable failed-main-migration fixture created.");
          NODE
          if DATABASE_URL=mysql://root:ci-root-password@127.0.0.1:3306/arbitrade_main_failed node scripts/guarded-main-migrate.mjs > /tmp/main-migration-guard.log 2>&1; then
            cat /tmp/main-migration-guard.log
            echo "Expected the main migration guard to refuse retry." >&2
            exit 1
          fi
          grep -q "Automatic retry is blocked" /tmp/main-migration-guard.log
          cat /tmp/main-migration-guard.log
          DATABASE_URL=mysql://root:ci-root-password@127.0.0.1:3306/arbitrade_main_failed node --input-type=module <<'NODE'
          import mysql from "mysql2/promise";
          const db = await mysql.createConnection(process.env.DATABASE_URL);
          const [tables] = await db.query("SELECT COUNT(*) AS count FROM information_schema.tables WHERE table_schema=DATABASE()");
          const [guard] = await db.query("SELECT status FROM main_migration_run_guard WHERE id=1");
          const [migrations] = await db.query("SELECT COUNT(*) AS count FROM __drizzle_migrations");
          await db.end();
          if (Number(tables[0].count) !== 2 || guard[0]?.status !== "failed" || Number(migrations[0].count) !== 1) {
            throw new Error("Main migration guard changed the fixture or migration tracker while refusing retry.");
          }
          console.log("PASS: failed main migration remains blocked; schema and tracker are unchanged.");
          NODE

      - name: Verify existing-database migration recovery guards
        env:
          DATABASE_URL: mysql://root:ci-root-password@127.0.0.1:3306/arbitrade_ci
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import mysql from "mysql2/promise";
          import { createHash } from "node:crypto";
          import { readFile } from "node:fs/promises";
          const admin = await mysql.createConnection(process.env.DATABASE_URL);
          await admin.query("CREATE DATABASE arbitrade_existing");
          await admin.query("CREATE DATABASE arbitrade_failed");
          await admin.query("CREATE TABLE arbitrade_existing.kyc_settings (id INT NOT NULL PRIMARY KEY)");
          await admin.end();

          const sql = await readFile("drizzle/0033_kyc_v2.sql", "utf8");
          const checksum = createHash("sha256").update(sql).digest("hex");
          const failed = await mysql.createConnection({
            host: "127.0.0.1", port: 3306, user: "root", password: "ci-root-password",
            database: "arbitrade_failed",
          });
          await failed.query(`
            CREATE TABLE portal_schema_migrations (
              migrationName VARCHAR(160) NOT NULL PRIMARY KEY,
              checksum CHAR(64) NOT NULL,
              status VARCHAR(32) NOT NULL,
              startedAt TIMESTAMP NULL,
              appliedAt TIMESTAMP NULL,
              errorCode VARCHAR(80) NULL,
              detailsJson JSON NULL,
              createdAt TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
              updatedAt TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
              INDEX portal_schema_migrations_status_idx (status, updatedAt)
            ) ENGINE=InnoDB
          `);
          await failed.execute(
            "INSERT INTO portal_schema_migrations (migrationName,checksum,status,errorCode) VALUES (?,?,?,?)",
            ["0033_kyc_v2.sql", checksum, "failed", "CI_SIMULATED_INTERRUPTION"],
          );
          await failed.end();
          console.log("Prepared isolated legacy-schema and interrupted-migration fixtures.");
          NODE

          set +e
          DATABASE_URL=mysql://root:ci-root-password@127.0.0.1:3306/arbitrade_existing node scripts/apply-portal-migrations.mjs >existing-schema.log 2>&1
          existing_status=$?
          set -e
          if [[ "$existing_status" -eq 0 ]] || ! grep -q "Existing portal schema objects were found but no per-file tracker exists" existing-schema.log; then
            cat existing-schema.log
            echo "Existing-schema guard did not reject an untracked existing database." >&2
            exit 1
          fi
          node --input-type=module <<'NODE'
          import mysql from "mysql2/promise";
          const db = await mysql.createConnection({
            host: "127.0.0.1", port: 3306, user: "root", password: "ci-root-password",
            database: "arbitrade_existing",
          });
          const [tracker] = await db.query("SELECT 1 FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name='portal_schema_migrations'");
          const [schema] = await db.query("SELECT 1 FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name='kyc_settings'");
          await db.end();
          if (tracker.length !== 0 || schema.length !== 1) throw new Error("Existing-schema guard changed the database unexpectedly.");
          console.log("PASS: existing untracked schema was preserved and no tracker was fabricated.");
          NODE

          set +e
          DATABASE_URL=mysql://root:ci-root-password@127.0.0.1:3306/arbitrade_failed node scripts/apply-portal-migrations.mjs >failed-migration.log 2>&1
          failed_status=$?
