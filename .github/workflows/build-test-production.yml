name: Build and test production source

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Type-check, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install from lockfile
        run: pnpm install --frozen-lockfile
      - name: TypeScript check
        run: pnpm check
      - name: Automated tests
        run: pnpm test
      - name: Production build
        run: pnpm build
