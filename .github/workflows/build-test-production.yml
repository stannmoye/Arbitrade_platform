name: Build and test production source

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Type-check, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Validate machine-readable source contract
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const manifest = JSON.parse(readFileSync("BUILD_SOURCE.json", "utf8"));
          assert.equal(manifest.manifest_version, 2, "Unexpected BUILD_SOURCE.json schema.");
          assert.equal(manifest.source_of_truth.repository, "stannmoye/Arbitrade_platform");
          assert.equal(manifest.source_of_truth.branch, "main");
          assert.equal(manifest.source_of_truth.deployment_ref, "refs/heads/main");
          assert.equal(manifest.build.container_definition, "Dockerfile");
          assert.equal(manifest.build.lockfile, "pnpm-lock.yaml");
          assert.equal(manifest.release.workflow, ".github/workflows/full-production-release.yml");
          assert.equal(typeof manifest.acceptance.production_certified, "boolean");
          assert.equal(typeof manifest.acceptance.hosted_stage_5_acceptance, "string");
          console.log("BUILD_SOURCE.json contract validated.");
          NODE
      - name: Install from lockfile
        run: pnpm install --frozen-lockfile
      - name: Validate canonical release workflow YAML syntax
        run: pnpm exec prettier .github/workflows/full-production-release.yml --parser yaml > /dev/null
      - name: TypeScript check
        run: pnpm check
      - name: Automated tests
        run: pnpm test
      - name: Production build
        run: pnpm build

  customer-browser-acceptance:
    name: Customer portal real-browser recovery checks
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build static client
        run: pnpm build:static
      - name: Install Playwright Chromium
        run: npx --yes --package=playwright playwright install --with-deps chromium
      - name: Start Vite preview
        run: |
          pnpm exec vite preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/arbitrade-vite-preview.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/arbitrade-vite-preview.log
          exit 1
      - name: Run customer and portal browser acceptance
        run: |
          npx --yes --package=playwright -c 'PLAYWRIGHT_MODULES="$(dirname "$(dirname "$(command -v playwright)")")"; NODE_PATH="$PLAYWRIGHT_MODULES" node scripts/stage2-browser-acceptance.cjs'
        shell: bash
        env:
          STAGE2_BASE_URL: http://127.0.0.1:4173
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-portal-browser-acceptance
          path: artifacts/stage2-browser/
          if-no-files-found: warn
          retention-days: 14
