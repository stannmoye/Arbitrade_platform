name: Extract Logo.dev company logo archive

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/extract-logo-dev-archive.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extract-logo-dev-archive-main
  cancel-in-progress: false

jobs:
  extract:
    name: Extract and verify Logo.dev assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify and extract archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="logodev-company-logos-normalized (1).zip"
          DEST="client/public/assets/company-logo-source"
          test -f "$ARCHIVE"
          python - <<'PY'
          import zipfile
          archive = "logodev-company-logos-normalized (1).zip"
          with zipfile.ZipFile(archive) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"Corrupt ZIP member: {bad}")
              names = z.namelist()
              logos = [n for n in names if n.startswith("logos/") and n.lower().endswith(".png")]
              if len(logos) != 1811:
                  raise SystemExit(f"Expected 1811 PNG logos, found {len(logos)}")
              required = {"logo-mapping.csv", "README.txt"}
              if not required.issubset(set(names)):
                  raise SystemExit("ZIP is missing logo-mapping.csv or README.txt")
              print(f"Verified ZIP: {len(logos)} PNG logos; {len(names)} total entries")
          PY
          mkdir -p "$DEST"
          unzip -oq "$ARCHIVE" "logos/*" "logo-mapping.csv" "README.txt" -d "$DEST"
          test "$(find "$DEST/logos" -maxdepth 1 -type f -iname '*.png' | wc -l | tr -d ' ')" = "1811"
          echo "Extracted 1,811 logos into $DEST/logos"

      - name: Commit extracted source archive contents
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/public/assets/company-logo-source
          if git diff --cached --quiet; then
            echo "No extracted asset changes to commit."
          else
            git commit -m "Extract Logo.dev company logos into source folder"
            git push origin HEAD:main
          fi
