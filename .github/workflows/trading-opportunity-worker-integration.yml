name: Trading opportunity worker concurrency and recovery integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feat/customer-opportunity-popup-*']

permissions:
  contents: read

jobs:
  opportunity-worker:
    name: Opportunity worker lifecycle on ${{ matrix.database }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: MySQL 8.4
            image: mysql:8.4
            health_cmd: mysqladmin ping -h 127.0.0.1 -uroot -proot
          - database: MariaDB 11.4
            image: mariadb:11.4
            health_cmd: mariadb-admin ping --silent
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: arbitrade_opportunity_worker_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.health_cmd }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium for authenticated local browser acceptance
        run: pnpm exec playwright install --with-deps chromium
      - name: Apply guarded migrations to disposable database
        run: node scripts/guarded-main-migrate.mjs
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/arbitrade_opportunity_worker_test
      - name: Verify package-specific fee version migration and immutable history
        run: pnpm exec tsx scripts/trading-package-fee-policy.integration.ts
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/arbitrade_opportunity_worker_test
          RUN_DISPOSABLE_PACKAGE_FEE_INTEGRATION: "1"
      - name: Verify global Trade controls migration precedence and idempotency
        run: pnpm exec vitest run server/trading-global-policy-migration.integration.test.ts
        env:
          TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/arbitrade_opportunity_worker_test
      - name: Verify global Trade controls authorization, audit, and rollback
        run: pnpm exec vitest run server/trading-global-controls-api.integration.test.ts
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/arbitrade_opportunity_worker_test
          RUN_TRADE_GLOBAL_CONTROLS_DB_INTEGRATION: "1"
      - name: Bridge and verify worker runtime schema contracts
        run: node scripts/ensure-worker-runtime-schema.mjs
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/arbitrade_opportunity_worker_test
      - name: Profile bounded worker-health diagnostics and memory
        run: pnpm profile:worker-health
        env:
          WORKER_HEALTH_PROFILE_ITERATIONS: "5000"
      - name: Verify partial-batch failures persist as degraded worker health
        run: pnpm exec tsx scripts/trading-worker-health.integration.ts
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/arbitrade_opportunity_worker_test
      - name: Exercise concurrent claims, lease recovery, fencing, and duplicate financial effects
        run: pnpm exec tsx scripts/trading-opportunity-worker.integration.ts
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/arbitrade_opportunity_worker_test
      - name: Start the application server against the disposable database
        shell: bash
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/arbitrade_opportunity_worker_test
          NODE_ENV: development
          PORT: "4317"
          SESSION_SECRET: github-actions-disposable-browser-session-secret
        run: |
          set -euo pipefail
          pnpm dev > "$RUNNER_TEMP/trading-local-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/trading-local-server.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4317/api/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/trading-local-server.log"
          exit 1
      - name: Verify qualified customer popup delivery without financial mutations
        run: pnpm exec tsx scripts/trading-popup-delivery.integration.ts
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/arbitrade_opportunity_worker_test
          SESSION_SECRET: github-actions-disposable-browser-session-secret
          TRADING_BROWSER_ACCEPTANCE_BASE_URL: http://127.0.0.1:4317
      - name: Capture local application logs and stop the test server
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/trading-local-server.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/trading-local-server.pid")" 2>/dev/null || true
          fi
          if [[ -f "$RUNNER_TEMP/trading-local-server.log" ]]; then
            tail -n 300 "$RUNNER_TEMP/trading-local-server.log" > "$RUNNER_TEMP/trading-local-server-tail.log"
          fi
      - name: Upload local authenticated acceptance server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trading-local-browser-${{ matrix.database }}
          path: ${{ runner.temp }}/trading-local-server-tail.log
          if-no-files-found: ignore
          retention-days: 14
