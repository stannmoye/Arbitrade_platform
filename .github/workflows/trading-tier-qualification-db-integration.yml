name: Trading tier qualification database integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  qualification-queue:
    name: ${{ matrix.database }} migration, backfill, and concurrency checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: MySQL 8.4
            image: mysql:8.4
            health_cmd: mysqladmin ping -h 127.0.0.1 -uroot -proot
          - database: MariaDB 11.4
            image: mariadb:11.4
            health_cmd: mariadb-admin ping --silent
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: arbitrade_qualification_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.health_cmd }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Test queue migration and concurrent lease behavior against disposable MySQL
        run: node scripts/trading-tier-qualification-db.integration.mjs
        env:
          TRADING_QUALIFICATION_TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/arbitrade_qualification_test

  worker-entitlements:
    name: Real worker tier assignment and reversal integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: arbitrade_worker_integration
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply the full guarded migration chain to disposable MySQL
        run: node scripts/guarded-main-migrate.mjs
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/arbitrade_worker_integration
      - name: Exercise real worker tier assignment, cumulative quotas, reversal, leases and retries
        run: pnpm exec tsx scripts/trading-tier-qualification-worker.integration.ts
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/arbitrade_worker_integration
