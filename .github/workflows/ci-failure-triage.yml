name: CI failure triage

on:
  workflow_run:
    workflows:
      - Installer validation
      - Wallet concurrency integration
      - Mining settlement integration
      - ARBITRADE autonomy progress dashboard
      - Settlement idempotency integration
    types:
      - completed

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  open-triage-issue:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create a traceable CI failure report
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            const response = await github.rest.actions.listJobsForWorkflowRun({
              owner,
              repo,
              run_id: run.id,
              per_page: 100,
            });
            const failedJobs = response.data.jobs.filter(job => job.conclusion === "failure");
            const detail = failedJobs.map(job => {
              const failedSteps = (job.steps || [])
                .filter(step => step.conclusion === "failure")
                .map(step => "- Step: " + step.name)
                .join("\n");
              return "### " + job.name + "\n- Job conclusion: " + job.conclusion +
                "\n- Job logs: " + job.html_url +
                (failedSteps ? "\n" + failedSteps : "");
            }).join("\n\n");
            const pullRequests = (run.pull_requests || [])
              .map(pr => "- #" + pr.number)
              .join("\n") || "- No pull-request reference was attached to this run.";
            const title = "CI failure triage: " + run.name + " #" + run.run_number +
              " (" + String(run.head_sha || "").slice(0, 7) + ")";
            const body = [
              "## Failed validation run",
              "",
              "- Workflow: " + run.name,
              "- Run: " + run.html_url,
              "- Branch: `" + run.head_branch + "`",
              "- Commit: `" + run.head_sha + "`",
              "- Conclusion: **" + run.conclusion + "**",
              "- Pull requests:",
              pullRequests,
              "",
              "## Failed jobs and steps",
              "",
              detail || "The workflow failed, but the Jobs API did not return a failed job. Inspect the run page.",
              "",
              "## Required follow-up",
              "",
              "Use the active ChatGPT-led GitHub development workflow to inspect the exact failing logs, diagnose the cause, prepare a bounded fix, and rerun validation. This report does not authorize merge or production deployment.",
              "Do not enable the legacy API-key coding worker as part of the no-separate-API workflow."
            ].join("\n");
            const existing = await github.rest.search.issuesAndPullRequests({
              q: "repo:" + owner + "/" + repo + " is:issue in:title \"" + title + "\" ",
              per_page: 10,
            });
            if (existing.data.items.length) {
              core.info("A triage issue already exists for this workflow run: " + title);
              return;
            }
            await github.rest.issues.create({ owner, repo, title, body });
