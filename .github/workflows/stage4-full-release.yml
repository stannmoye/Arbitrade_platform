name: Retired Stage 4-only release (intentionally disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Explain the canonical release path
        run: |
          echo "::error::This Stage 4-only release workflow is retired."
          echo "Use .github/workflows/full-production-release.yml from refs/heads/main."
          echo "The canonical workflow packages the integrated application and verifies Stage 5 migrations."
          exit 1
