name: Stage 4 full application release package

on:
  push:
    branches:
      - integration/auth-installer-vps-safety
    paths:
      - '.github/workflows/stage4-full-release.yml'
      - 'src/**'
      - 'client/**'
      - 'server/**'
      - 'shared/**'
      - 'installer/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.*'
      - 'tsconfig.json'
      - 'drizzle.config.*'
      - 'components.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage4-full-release-publish
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out integrated Stage 1–4 application
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.18.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build production application
        run: pnpm build
      - name: Assemble full application ZIP
        run: |
          zip -qr arbitrade-stage4-full-application.zip . \
            -x './.git/*' \
               './.env' './.env.*' \
               './node_modules/.cache/*' \
               './.github/*' \
               './arbitrade-stage4-full-application.zip'
          test -s arbitrade-stage4-full-application.zip
          unzip -tq arbitrade-stage4-full-application.zip
          sha256sum arbitrade-stage4-full-application.zip
          ls -lh arbitrade-stage4-full-application.zip
      - name: Save release ZIP on GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: arbitrade-stage4-full-application
          path: arbitrade-stage4-full-application.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Publish GitHub release with the full application ZIP
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0-stage4-full
          name: Arbitrade Stage 4 — Full Application
          body: |
            Full application package integrating Stages 1–4 from the integration/auth-installer-vps-safety branch.

            The ZIP includes the repository source, locked dependencies, installer files, and production build output. Environment files and Git metadata are excluded.
          target_commitish: integration/auth-installer-vps-safety
          files: arbitrade-stage4-full-application.zip
          fail_on_unmatched_files: true
          generate_release_notes: false
