name: Download company logos for catalogue records 601-650

on:
  push:
    branches:
      - feature/verified-company-catalogue-rotation
    paths:
      - .github/workflows/download-company-logo-range-601-1000.yml

permissions:
  contents: write

concurrency:
  group: company-logo-range-601-650
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out the existing feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/verified-company-catalogue-rotation
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch official-site icons for records 601-650
        env:
          LOGO_START: "601"
          LOGO_COUNT: "50"
        run: node scripts/download-company-logo-google-batch.mjs
      - name: Commit saved icons and the range report for records 601-650
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A server/data/company-catalogue-1000.json server/data/company-logo-range-601-650-report.json client/public/assets/company-logos
          if git diff --cached --quiet; then
            echo "No changes were produced for records 601-650."
            exit 1
          fi
          git commit -m "Save official-site company icons for catalogue records 601-650"
          git push origin HEAD:feature/verified-company-catalogue-rotation
