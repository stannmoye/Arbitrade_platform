name: ARBITRADE autonomy progress dashboard

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feat/arbitrade-autonomy-control-plane
      - integration/auth-installer-vps-safety
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arbitrade-progress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  progress-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Publish evidence-based progress summary
        shell: bash
        run: |
          set -euo pipefail
          queue="docs/ARBITRADE_STAGE1_AUTOMATION_QUEUE.md"
          progress="docs/ARBITRADE_STAGE_1_PROGRESS_2026-10-18.md"
          readiness="docs/ARBITRADE_AUTONOMY_READINESS.md"

          {
            echo "# ARBITRADE autonomy progress"
            echo
            echo "- **Event:** \`${GITHUB_EVENT_NAME}\`"
            echo "- **Ref:** \`${GITHUB_REF}\`"
            echo "- **Commit:** [\`${GITHUB_SHA:0:12}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})"
            echo "- **Run:** [View this run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo
            echo "## Task queue"
            echo
            if [[ -f "$queue" ]]; then
              awk '/^### S1-/{task=$0; getline; print task " — " $0}' "$queue"
            else
              echo "Queue document is not present on this revision."
            fi
            echo
            echo "## Readiness gates"
            echo
            if [[ -f "$readiness" ]]; then
              grep -E '^\| [0-9]+\.' "$readiness" || true
            else
              echo "Readiness matrix is not present on this revision."
            fi
            echo
            echo "## Automation status"
            echo
            echo "- This workflow reports repository evidence; it does not itself write application code."
            echo "- A green report job is not a production approval."
            echo "- Autonomous coding remains blocked until the API quota issue is resolved and a controlled worker run is verified."
            echo "- Production merge/deploy and live financial operations remain human-authorized."
            echo
            if [[ -f "$progress" ]]; then
              echo "Detailed status: \`$progress\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify required status documents exist
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/ARBITRADE_STAGE1_AUTOMATION_QUEUE.md
          test -s docs/ARBITRADE_STAGE_1_PROGRESS_2026-10-18.md
          test -s docs/ARBITRADE_AUTONOMY_READINESS.md
