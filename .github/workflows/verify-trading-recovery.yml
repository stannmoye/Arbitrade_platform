name: Verify Arbitrade trading recovery changes

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/verified-company-catalogue-rotation

permissions:
  contents: read

concurrency:
  group: trading-recovery-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm check
      - name: Run tests
        run: pnpm test
      - name: Build production application
        run: pnpm build
