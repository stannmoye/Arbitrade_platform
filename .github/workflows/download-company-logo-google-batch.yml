name: Download company logos from official websites in 50-company batches

on:
  # Manual-only: each batch fetches icons only from confirmed official company homepages.
  workflow_dispatch:
    inputs:
      batch:
        description: "Batch number (50 companies per batch, 1–20)"
        required: true
        default: "1"
        type: string

permissions:
  contents: write

concurrency:
  group: company-logo-official-site-batch
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out existing feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/verified-company-catalogue-rotation
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch icons from official company websites for the selected batch
        env:
          LOGO_BATCH: \${{ github.event.inputs.batch || '1' }}
        run: node scripts/download-company-logo-google-batch.mjs
      - name: Commit local icons, catalogue metadata, and batch report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A server/data/company-catalogue-1000.json server/data/company-logo-batch-*-report.json client/public/assets/company-logos
          if git diff --cached --quiet; then
            echo "No changes were produced for this batch."
            exit 1
          fi
          git commit -m "Save official-site company icons for batch \${{ github.event.inputs.batch || '1' }}"
          git push origin HEAD:feature/verified-company-catalogue-rotation
